services:
  paymentledger.redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  paymentledger.postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - paymentledger-postgres-data:/var/lib/postgresql/data

  paymentledger.kafka:
    image: apache/kafka:latest
    container_name: paymentledger-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://paymentledger.kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    volumes:
      - paymentledger-kafka-data:/var/lib/kafka/data

  paymentledger.kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: paymentledger-kafka-ui
    ports:
      - "8085:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: paymentledger-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: paymentledger.kafka:29092
    depends_on:
      paymentledger.kafka:
        condition: service_healthy

  # Optional RabbitMQ alternative (run with --profile rabbitmq)
  paymentledger.rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: paymentledger-rabbitmq
    profiles: ["rabbitmq"]
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - paymentledger-rabbitmq-data:/var/lib/rabbitmq

  paymentledger.api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      paymentledger.postgres:
        condition: service_healthy
      paymentledger.redis:
        condition: service_healthy
      paymentledger.kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=paymentledger.postgres;Port=5432;Database=payment_ledger;Username=postgres;Password=postgres
      ConnectionStrings__Redis: paymentledger.redis:6379
      Kafka__BootstrapServers: paymentledger.kafka:29092
      Kafka__Topic: payment-ledger.events
      Kafka__GroupId: payment-ledger-group
      Kafka__Enabled: "true"
      TreasuryWallet__UserEmail: treasury@paymentledger.local
      TreasuryWallet__FullName: Payment Ledger Treasury
      TreasuryWallet__Currencies__0: USD
      TreasuryWallet__Currencies__1: INR
      DisableHttpsRedirection: "true"
    ports:
      - "8080:8080"

  paymentledger.ui:
    build:
      context: ./PaymentLedger.UI
      dockerfile: Dockerfile
    depends_on:
      - paymentledger.api
    ports:
      - "4200:80"
    environment:
      # Optional: In a real production setup, you'd use env vars or Nginx substitution
      # to point the frontend to the backend URL dynamically.
      - NGINX_PORT=80

volumes:
  paymentledger-postgres-data:
  paymentledger-kafka-data:
  paymentledger-rabbitmq-data:
